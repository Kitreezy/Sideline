name: TennisForm
options:
  bundleIdPrefix: dev.shiruba.tennisform
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Signing.xcconfig лежит в гите и подтягивает Local.xcconfig, если тот есть.
# У каждого своя команда разработчика, и регенерация проекта её не затирает.
configFiles:
  Debug: Configs/Signing.xcconfig
  Release: Configs/Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    CODE_SIGN_STYLE: Automatic

targets:
  StrokeKit:
    type: framework
    platform: iOS
    sources:
      - Sources/StrokeKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tennisform.strokekit
        GENERATE_INFOPLIST_FILE: YES
        DEFINES_MODULE: YES

  TennisForm:
    type: application
    platform: iOS
    sources:
      - Sources/TennisForm
    dependencies:
      - target: StrokeKit
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).tennisform
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Форма"
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Нужен доступ к галерее, чтобы разобрать видео твоих ударов. Видео обрабатывается только на устройстве."
        INFOPLIST_KEY_NSCameraUsageDescription: "Камера нужна, чтобы проверить, на какой частоте кадров этот телефон может снимать и одновременно разбирать позу."
        INFOPLIST_KEY_UISupportedInterfaceParameters: ""
        TARGETED_DEVICE_FAMILY: "1,2"

  StrokeKitTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests/StrokeKitTests
    dependencies:
      - target: StrokeKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  TennisForm:
    build:
      targets:
        TennisForm: all
        StrokeKitTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - StrokeKitTests
